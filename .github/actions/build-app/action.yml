name: Build App
description: Node setup, install dependencies, and build production app
inputs:
  version:
    description: Package version to set (e.g. from tag). When provided, updates package.json before build.
    required: false
  apple_id:
    description: Apple ID to use for notarization.
    required: false
  apple_app_specific_password:
    description: Apple App Specific Password to use for notarization.
    required: false
  apple_team_id:
    description: Apple Team ID to use for notarization.
    required: false
  apple_certificate_base64:
    description: Base64-encoded .p12 signing certificate (for codesign). Not the same as Apple ID.
    required: false
  apple_certificate_password:
    description: Password for the .p12 certificate (set when exporting from Keychain). May differ from app-specific password.
    required: false
  gh_token:
    description: GitHub token to use for authentication.
    required: false
  update_repo_owner:
    description: >-
      Owner of the GitHub repository the in-app updater reads releases from. Optional; the build
      falls back to the default in config/index.js.
    required: false
    default: ''
  update_repo_name:
    description: >-
      Name of the GitHub repository the in-app updater reads releases from. Optional; the build
      falls back to the default in config/index.js.
    required: false
    default: ''
  auto_update_url:
    description: >-
      Base URL of a static update feed, without the channel suffix. Set only by a pipeline that
      publishes to object storage instead of GitHub Releases; it takes precedence over
      update_repo_owner/name.
    required: false
    default: ''
  app_id:
    description: >-
      Bundle id the build ships under. There is no default — packaging without it fails — because an
      operating system matches an update against the bundle id, so a guessed one installs beside the
      application it was meant to replace. Only unpackaged builds (a fork's pull request) may leave
      it empty.
    required: false
    default: ''
  product_name:
    description: >-
      Display name matching app_id. Unpackaged builds fall back to a placeholder derived from the
      package name; packaging without it fails.
    required: false
    default: ''
  app_name:
    description: >-
      Packaged `name`, which is what Electron derives the user-data directory from. Changing it
      moves every existing install to a fresh profile; packaging without it fails.
    required: false
    default: ''
  app_author:
    description: >-
      Who the build is copyrighted to, and the maintainer recorded in the Linux package metadata.
      Optional — falls back to the `author` in package.json, and unlike the identity above it does
      not fail the packaging step when unset.
    required: false
    default: ''
  app_id_develop:
    description: >-
      Bundle id for builds that are not `build_type: production`. Optional — leave it unset to ship
      one identity for every build type, set it to make develop a separate application with its own
      install slot and profile.
    required: false
    default: ''
  product_name_develop:
    description: Display name matching app_id_develop. Optional, same reasoning.
    required: false
    default: ''
  app_name_develop:
    description: Packaged `name` matching app_id_develop. Optional, same reasoning.
    required: false
    default: ''
  environments:
    description: JSON environment catalog (VITE_ENVIRONMENTS) baked into the renderer at build time. The app fails to boot without it.
    required: true
  firebase_api_key:
    description: Firebase Remote Config client apiKey (public client id). Required for Remote Config; the app has no config fallback without it.
    required: true
  firebase_project_id:
    description: Firebase Remote Config projectId (public client id).
    required: true
  firebase_app_id:
    description: Firebase Remote Config appId (public client id).
    required: true
  webrtc_turn_host:
    description: WebRTC TURN relay host for P2P chat.
    required: true
  webrtc_turn_secret:
    description: WebRTC TURN relay secret for P2P chat.
    required: true
  webrtc_turn_ttl:
    description: WebRTC TURN relay secret TTL in seconds for P2P chat.
    required: true
  include_dist_artifacts:
    description: Include dist artifacts in artifacts.
    required: false
    default: false
  arch:
    description: Electron-builder arch flag for Linux (e.g. --x64 or --arm64). When set, only builds Linux for that arch.
    required: false
  artifact_suffix:
    description: Suffix for artifact name to avoid collisions (e.g. Linux-arm64). When empty, uses runner.os.
    required: false
  sentry_dsn:
    description: Sentry DSN. Required when sentry_required is true.
    required: false
  sentry_auth_token:
    description: Sentry auth token for source-map upload. Required when sentry_required is true.
    required: false
  sentry_org:
    description: Sentry organization slug. Required when sentry_required is true.
    required: false
  sentry_project:
    description: Sentry project slug. Required when sentry_required is true.
    required: false
  sentry_required:
    description: When 'true', fail the job if any sentry_* input is empty.
    required: false
    default: 'false'
  build_type:
    description: >-
      Build type: 'dev' (default) or 'production'. A dev build compiles main/preload/renderer
      with --mode development and RENDERER_SOURCE=filesystem, keeping the dev/test affordances
      that isProductionBuild() hides (network picker, onboarding skip button). Serves e2e-suite
      builds and installable dev builds; pass 'production' for release-grade builds.
    required: false
    default: 'dev'
  enable_auto_update:
    description: Enables self-update in the built app. Independent of build_type; set only by the release pipeline.
    required: false
    default: false

runs:
  using: composite
  steps:
    - name: Verify Sentry secrets
      if: inputs.sentry_required == 'true'
      shell: bash
      run: |
        set -e
        missing=()
        [ -z "${{ inputs.sentry_dsn }}" ] && missing+=("sentry_dsn")
        [ -z "${{ inputs.sentry_auth_token }}" ] && missing+=("sentry_auth_token")
        [ -z "${{ inputs.sentry_org }}" ] && missing+=("sentry_org")
        [ -z "${{ inputs.sentry_project }}" ] && missing+=("sentry_project")
        if [ ${#missing[@]} -gt 0 ]; then
          echo "Missing required Sentry inputs: ${missing[*]}"
          exit 1
        fi

    - name: Node
      uses: ./.github/actions/setup-node

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Update package.json version from tag
      if: inputs.version != ''
      id: set-version
      shell: bash
      run: |
        npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
        echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT

    - name: Verify macOS signing inputs
      if: runner.os == 'macOS' && (inputs.include_dist_artifacts == true || inputs.include_dist_artifacts == 'true')
      shell: bash
      env:
        APPLE_ID: ${{ inputs.apple_id }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.apple_app_specific_password }}
        APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
        CERTIFICATE_OSX_APPLICATION: ${{ inputs.apple_certificate_base64 }}
        CERTIFICATE_PASSWORD: ${{ inputs.apple_certificate_password }}
      run: |
        set -euo pipefail
        missing=()
        [ -z "$APPLE_ID" ] && missing+=(APPLE_ID)
        [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && missing+=(APPLE_APP_SPECIFIC_PASSWORD)
        [ -z "$APPLE_TEAM_ID" ] && missing+=(APPLE_TEAM_ID)
        [ -z "$CERTIFICATE_OSX_APPLICATION" ] && missing+=(CERTIFICATE_OSX_APPLICATION)
        [ -z "$CERTIFICATE_PASSWORD" ] && missing+=(CERTIFICATE_PASSWORD)
        if [ ${#missing[@]} -gt 0 ]; then
          echo "A packaged macOS build must be signed and notarized. Missing: ${missing[*]}" >&2
          exit 1
        fi

    - name: Add macOS certificate
      if: runner.os == 'macOS' && (inputs.include_dist_artifacts == true || inputs.include_dist_artifacts == 'true')
      shell: bash
      run: chmod +x .github/add_cert_in_keychain.sh && .github/add_cert_in_keychain.sh
      env:
        CERTIFICATE_OSX_APPLICATION: ${{ inputs.apple_certificate_base64 }}
        CERTIFICATE_PASSWORD: ${{ inputs.apple_certificate_password }}

    - name: Build application
      if: inputs.build_type != 'dev'
      shell: bash
      run: npm run r clean:build clean:prod build postbuild
      env:
        BUILD_TYPE: ${{ inputs.build_type }}
        ENABLE_AUTO_UPDATE: ${{ inputs.enable_auto_update }}
        UPDATE_REPO_OWNER: ${{ inputs.update_repo_owner }}
        UPDATE_REPO_NAME: ${{ inputs.update_repo_name }}
        AUTO_UPDATE_URL: ${{ inputs.auto_update_url }}
        APP_ID: ${{ inputs.app_id }}
        PRODUCT_NAME: ${{ inputs.product_name }}
        APP_NAME: ${{ inputs.app_name }}
        APP_ID_DEVELOP: ${{ inputs.app_id_develop }}
        PRODUCT_NAME_DEVELOP: ${{ inputs.product_name_develop }}
        APP_NAME_DEVELOP: ${{ inputs.app_name_develop }}
        APP_AUTHOR: ${{ inputs.app_author }}
        VITE_ENVIRONMENTS: ${{ inputs.environments }}
        VITE_FIREBASE_API_KEY: ${{ inputs.firebase_api_key }}
        VITE_FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
        VITE_FIREBASE_APP_ID: ${{ inputs.firebase_app_id }}
        VITE_WEBRTC_TURN_HOST: ${{ inputs.webrtc_turn_host }}
        VITE_WEBRTC_TURN_SECRET: ${{ inputs.webrtc_turn_secret }}
        VITE_WEBRTC_TURN_TTL: ${{ inputs.webrtc_turn_ttl }}
        SENTRY_DSN: ${{ inputs.sentry_dsn }}
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry_auth_token }}
        SENTRY_ORG: ${{ inputs.sentry_org }}
        SENTRY_PROJECT: ${{ inputs.sentry_project }}

    # Development build (≡ `npm run build:e2e` + postbuild). postbuild keeps release/build
    # packageable by electron-builder; it is inert for e2e, which launches
    # release/build/main.cjs directly. No Sentry env — dev builds emit no hidden sourcemaps.
    - name: Build application (dev)
      if: inputs.build_type == 'dev'
      shell: bash
      run: npm run r build:dev postbuild
      env:
        BUILD_TYPE: ${{ inputs.build_type }}
        RENDERER_SOURCE: filesystem
        ENABLE_AUTO_UPDATE: ${{ inputs.enable_auto_update }}
        UPDATE_REPO_OWNER: ${{ inputs.update_repo_owner }}
        UPDATE_REPO_NAME: ${{ inputs.update_repo_name }}
        AUTO_UPDATE_URL: ${{ inputs.auto_update_url }}
        APP_ID: ${{ inputs.app_id }}
        PRODUCT_NAME: ${{ inputs.product_name }}
        APP_NAME: ${{ inputs.app_name }}
        APP_ID_DEVELOP: ${{ inputs.app_id_develop }}
        PRODUCT_NAME_DEVELOP: ${{ inputs.product_name_develop }}
        APP_NAME_DEVELOP: ${{ inputs.app_name_develop }}
        APP_AUTHOR: ${{ inputs.app_author }}
        VITE_ENVIRONMENTS: ${{ inputs.environments }}
        VITE_FIREBASE_API_KEY: ${{ inputs.firebase_api_key }}
        VITE_FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
        VITE_FIREBASE_APP_ID: ${{ inputs.firebase_app_id }}
        VITE_WEBRTC_TURN_HOST: ${{ inputs.webrtc_turn_host }}
        VITE_WEBRTC_TURN_SECRET: ${{ inputs.webrtc_turn_secret }}
        VITE_WEBRTC_TURN_TTL: ${{ inputs.webrtc_turn_ttl }}

    - name: Include dist artifacts
      if: inputs.include_dist_artifacts == true || inputs.include_dist_artifacts == 'true'
      shell: bash
      run: npm run dist -- ${{ inputs.arch }}
      env:
        BUILD_TYPE: ${{ inputs.build_type }}
        APPLE_ID: ${{ inputs.apple_id }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.apple_app_specific_password }}
        APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
        GH_TOKEN: ${{ inputs.gh_token }}
        UPDATE_REPO_OWNER: ${{ inputs.update_repo_owner }}
        UPDATE_REPO_NAME: ${{ inputs.update_repo_name }}
        AUTO_UPDATE_URL: ${{ inputs.auto_update_url }}
        APP_ID: ${{ inputs.app_id }}
        PRODUCT_NAME: ${{ inputs.product_name }}
        APP_NAME: ${{ inputs.app_name }}
        APP_ID_DEVELOP: ${{ inputs.app_id_develop }}
        PRODUCT_NAME_DEVELOP: ${{ inputs.product_name_develop }}
        APP_NAME_DEVELOP: ${{ inputs.app_name_develop }}
        APP_AUTHOR: ${{ inputs.app_author }}

    - name: Verify macOS signature and notarization
      if: runner.os == 'macOS' && (inputs.include_dist_artifacts == true || inputs.include_dist_artifacts == 'true')
      shell: bash
      env:
        EXPECTED_TEAM_ID: ${{ inputs.apple_team_id }}
      run: |
        set -euo pipefail
        apps=()
        while IFS= read -r -d '' app; do
          apps+=("$app")
        done < <(find release/dist -mindepth 2 -maxdepth 2 -type d -name '*.app' -print0)

        if [ ${#apps[@]} -eq 0 ]; then
          echo "No packaged macOS application was found under release/dist." >&2
          exit 1
        fi

        for app in "${apps[@]}"; do
          echo "Verifying $app"
          codesign --verify --deep --strict --verbose=2 "$app"

          signing_info="$(codesign --display --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signing_info"
          if ! grep -Fq "TeamIdentifier=$EXPECTED_TEAM_ID" <<< "$signing_info"; then
            echo "Unexpected or missing TeamIdentifier for $app." >&2
            exit 1
          fi

          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
        done

    - name: Prepare Linux update metadata for multi-arch
      if: runner.os == 'Linux' && (inputs.include_dist_artifacts == true || inputs.include_dist_artifacts == 'true')
      shell: bash
      run: |
        if [ -f release/dist/latest-linux.yml ]; then
          if [ "${{ inputs.arch }}" = "--x64" ]; then
            cp release/dist/latest-linux.yml release/dist/latest-linux-x64.yml
          elif [ "${{ inputs.arch }}" = "--arm64" ]; then
            cp release/dist/latest-linux.yml release/dist/latest-linux-arm64.yml
          fi
        fi

    - name: Upload dist artifacts
      if: inputs.include_dist_artifacts == true || inputs.include_dist_artifacts == 'true'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: build-artifacts-${{ inputs.artifact_suffix || runner.os }}
        path: |
          release/dist/*.exe
          release/dist/*.dmg
          release/dist/*.zip
          release/dist/*.AppImage
          release/dist/*.blockmap
          release/dist/latest.yml
          release/dist/latest-mac.yml
          release/dist/latest-linux*.yml

    - name: Upload build output for E2E
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: build-output-${{ inputs.artifact_suffix || runner.os }}
        path: release/build

    - name: Remove macOS signing keychain
      if: always() && runner.os == 'macOS' && (inputs.include_dist_artifacts == true || inputs.include_dist_artifacts == 'true')
      shell: bash
      run: bash .github/remove_cert_keychain.sh
